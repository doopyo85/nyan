<!doctype html>
<html lang="ko" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냥코대전쟁</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    
    .game-font { font-family: 'Black Han Sans', sans-serif; }
    .ui-font { font-family: 'Noto Sans KR', sans-serif; }
    
    @keyframes walk {
      0%, 100% { transform: translateY(0) scaleX(var(--dir, 1)); }
      50% { transform: translateY(-3px) scaleX(var(--dir, 1)); }
    }
    
    @keyframes attack {
      0% { transform: scaleX(var(--dir, 1)) rotate(0deg); }
      25% { transform: scaleX(var(--dir, 1)) rotate(-10deg); }
      50% { transform: scaleX(var(--dir, 1)) rotate(10deg); }
      75% { transform: scaleX(var(--dir, 1)) rotate(-5deg); }
      100% { transform: scaleX(var(--dir, 1)) rotate(0deg); }
    }
    
    @keyframes hit {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(2) saturate(0); }
    }
    
    @keyframes spawn {
      0% { transform: scale(0) translateY(20px); opacity: 0; }
      50% { transform: scale(1.2) translateY(-5px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    
    @keyframes death {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }
    
    @keyframes cloudMove {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(calc(100vw + 100px)); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    .unit.walking { animation: walk 0.3s ease-in-out infinite; }
    .unit.attacking { animation: attack 0.2s ease-in-out; }
    .unit.hit { animation: hit 0.15s ease-out; }
    .unit.spawning { animation: spawn 0.3s ease-out forwards; }
    .unit.dying { animation: death 0.4s ease-out forwards; }
    
    .cloud { animation: cloudMove 30s linear infinite; }
    .float { animation: float 2s ease-in-out infinite; }
    
    .cat-btn {
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .cat-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .cat-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }
    .cat-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .cat-btn .cooldown-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      transition: height 0.1s linear;
    }
    
    .health-bar {
      transition: width 0.2s ease-out;
    }
    
    .money-popup {
      animation: moneyPop 0.8s ease-out forwards;
      pointer-events: none;
    }
    
    @keyframes moneyPop {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-30px) scale(0.8); opacity: 0; }
    }
    
    .grass {
      background: linear-gradient(to top, #4a7c23, #5d9c2a);
    }
    
    .sky {
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F4FF 100%);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full ui-font">
  <div id="app" class="h-full flex flex-col"><!-- 시작 화면 -->
   <div id="start-screen" class="h-full flex flex-col items-center justify-center sky relative overflow-hidden">
    <div class="cloud absolute top-10 opacity-70" style="animation-delay: -5s;">
     <svg width="80" height="40" viewbox="0 0 80 40">
      <ellipse cx="40" cy="25" rx="35" ry="15" fill="white" /><ellipse cx="25" cy="20" rx="20" ry="12" fill="white" /><ellipse cx="55" cy="18" rx="18" ry="10" fill="white" />
     </svg>
    </div>
    <div class="cloud absolute top-20 opacity-60" style="animation-delay: -15s;">
     <svg width="100" height="50" viewbox="0 0 100 50">
      <ellipse cx="50" cy="30" rx="40" ry="18" fill="white" /><ellipse cx="30" cy="25" rx="25" ry="14" fill="white" /><ellipse cx="70" cy="22" rx="22" ry="12" fill="white" />
     </svg>
    </div>
    <div class="text-center z-10">
     <div class="float">
      <div class="text-8xl mb-4">
       🐱
      </div>
     </div>
     <h1 id="game-title" class="game-font text-5xl md:text-7xl text-orange-500 mb-2" style="text-shadow: 4px 4px 0 #c2410c, -2px -2px 0 #fff;">냥코대전쟁</h1>
     <p class="text-xl text-gray-600 mb-8">고양이 군단을 이끌고 적 기지를 파괴하라!</p><button onclick="startGame()" class="cat-btn bg-gradient-to-b from-orange-400 to-orange-600 text-white px-12 py-4 rounded-2xl text-2xl game-font shadow-lg border-b-4 border-orange-700"> 🎮 게임 시작 </button>
     <div class="mt-8 bg-white/80 rounded-xl p-4 max-w-md mx-4 shadow-lg">
      <h3 class="font-bold text-lg mb-2">🎯 게임 방법</h3>
      <ul class="text-left text-sm space-y-1 text-gray-700">
       <li>💰 시간이 지나면 자동으로 돈이 모입니다</li>
       <li>🐱 하단 버튼을 클릭해 고양이를 소환하세요</li>
       <li>⚔️ 고양이들이 자동으로 적과 싸웁니다</li>
       <li>🏰 적 기지를 먼저 파괴하면 승리!</li>
      </ul>
     </div>
    </div>
   </div><!-- 게임 화면 -->
   <div id="game-screen" class="h-full flex-col hidden"><!-- 상단 UI -->
    <div class="bg-gradient-to-r from-gray-800 to-gray-900 text-white p-2 flex items-center justify-between shadow-lg">
     <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-yellow-500/20 px-3 py-1 rounded-full"><span class="text-2xl">💰</span> <span id="money" class="text-xl font-bold text-yellow-400">500</span>
      </div>
      <div class="text-sm text-gray-400">
       Wave: <span id="wave" class="text-white font-bold">1</span>
      </div>
     </div><button onclick="showPauseMenu()" class="cat-btn bg-gray-700 hover:bg-gray-600 px-4 py-1 rounded-lg text-sm"> ⏸️ 일시정지 </button>
    </div><!-- 게임 영역 -->
    <div class="flex-1 relative sky overflow-hidden"><!-- 배경 구름 -->
     <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <div class="cloud absolute top-5 opacity-50" style="animation-delay: -10s;">
       <svg width="60" height="30" viewbox="0 0 60 30">
        <ellipse cx="30" cy="18" rx="25" ry="12" fill="white" /><ellipse cx="18" cy="15" rx="15" ry="9" fill="white" /><ellipse cx="42" cy="14" rx="14" ry="8" fill="white" />
       </svg>
      </div>
      <div class="cloud absolute top-16 opacity-40" style="animation-delay: -20s;">
       <svg width="80" height="40" viewbox="0 0 80 40">
        <ellipse cx="40" cy="24" rx="32" ry="14" fill="white" /><ellipse cx="24" cy="20" rx="18" ry="10" fill="white" /><ellipse cx="56" cy="18" rx="16" ry="9" fill="white" />
       </svg>
      </div>
     </div><!-- 산 배경 -->
     <div class="absolute bottom-20 left-0 right-0">
      <svg width="100%" height="80" viewbox="0 0 400 80" preserveaspectratio="none"><polygon points="0,80 50,30 100,80" fill="#6b8e5e" /> <polygon points="80,80 150,20 220,80" fill="#5a7d4f" /> <polygon points="180,80 260,25 340,80" fill="#6b8e5e" /> <polygon points="300,80 370,35 400,60 400,80" fill="#5a7d4f" />
      </svg>
     </div><!-- 기지들 -->
     <div class="absolute bottom-20 left-4 w-20 h-24 flex flex-col items-center">
      <div class="text-4xl">
       🏠
      </div>
      <div class="w-full bg-gray-700 rounded-full h-2 mt-1">
       <div id="player-base-hp" class="health-bar bg-green-500 h-2 rounded-full" style="width: 100%"></div>
      </div><span class="text-xs text-white bg-black/50 px-1 rounded mt-1">아군 기지</span>
     </div>
     <div class="absolute bottom-20 right-4 w-20 h-24 flex flex-col items-center">
      <div class="text-4xl">
       🏯
      </div>
      <div class="w-full bg-gray-700 rounded-full h-2 mt-1">
       <div id="enemy-base-hp" class="health-bar bg-red-500 h-2 rounded-full" style="width: 100%"></div>
      </div><span class="text-xs text-white bg-black/50 px-1 rounded mt-1">적 기지</span>
     </div><!-- 유닛 전장 -->
     <div id="battlefield" class="absolute bottom-20 left-0 right-0 h-20"><!-- 유닛들이 여기에 생성됨 -->
     </div><!-- 잔디 -->
     <div class="absolute bottom-0 left-0 right-0 h-20 grass"></div><!-- 데미지/돈 팝업 컨테이너 -->
     <div id="popup-container" class="absolute inset-0 pointer-events-none"></div>
    </div><!-- 하단 고양이 선택 UI -->
    <div class="bg-gradient-to-t from-amber-800 to-amber-700 p-3 shadow-inner">
     <div id="cat-buttons" class="flex gap-2 overflow-x-auto pb-2 justify-center"><!-- 고양이 버튼들이 여기에 생성됨 -->
     </div>
    </div>
   </div><!-- 일시정지 메뉴 -->
   <div id="pause-menu" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50" style="display: none;">
    <div class="bg-white rounded-2xl p-6 text-center shadow-2xl max-w-sm mx-4">
     <h2 class="game-font text-3xl text-gray-800 mb-4">⏸️ 일시정지</h2>
     <div class="space-y-3"><button onclick="resumeGame()" class="cat-btn w-full bg-gradient-to-b from-green-400 to-green-600 text-white py-3 rounded-xl text-lg font-bold border-b-4 border-green-700"> ▶️ 계속하기 </button> <button onclick="restartGame()" class="cat-btn w-full bg-gradient-to-b from-orange-400 to-orange-600 text-white py-3 rounded-xl text-lg font-bold border-b-4 border-orange-700"> 🔄 다시 시작 </button> <button onclick="goToTitle()" class="cat-btn w-full bg-gradient-to-b from-gray-400 to-gray-600 text-white py-3 rounded-xl text-lg font-bold border-b-4 border-gray-700"> 🏠 타이틀로 </button>
     </div>
    </div>
   </div><!-- 게임 결과 화면 -->
   <div id="result-screen" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50" style="display: none;">
    <div class="bg-white rounded-2xl p-8 text-center shadow-2xl max-w-sm mx-4">
     <div id="result-icon" class="text-6xl mb-4">
      🎉
     </div>
     <h2 id="result-title" class="game-font text-4xl text-gray-800 mb-2">승리!</h2>
     <p id="result-message" class="text-gray-600 mb-6">적 기지를 파괴했습니다!</p>
     <div class="space-y-3"><button onclick="restartGame()" class="cat-btn w-full bg-gradient-to-b from-orange-400 to-orange-600 text-white py-3 rounded-xl text-lg font-bold border-b-4 border-orange-700"> 🔄 다시 하기 </button> <button onclick="goToTitle()" class="cat-btn w-full bg-gradient-to-b from-gray-400 to-gray-600 text-white py-3 rounded-xl text-lg font-bold border-b-4 border-gray-700"> 🏠 타이틀로 </button>
     </div>
    </div>
   </div>
  </div>
  <script>
    // ===== 게임 설정 =====
    const CAT_TYPES = [
      { id: 'basic', name: '기본냥', emoji: '🐱', cost: 50, hp: 120, atk: 30, speed: 1.2, range: 30, cooldown: 1500, atkSpeed: 600 },
      { id: 'tank', name: '탱크냥', emoji: '🐯', cost: 120, hp: 350, atk: 20, speed: 0.8, range: 25, cooldown: 3000, atkSpeed: 1000 },
      { id: 'fast', name: '질주냥', emoji: '🐆', cost: 70, hp: 80, atk: 35, speed: 2, range: 25, cooldown: 2000, atkSpeed: 400 },
      { id: 'range', name: '궁수냥', emoji: '🏹', cost: 100, hp: 60, atk: 45, speed: 0.9, range: 80, cooldown: 2000, atkSpeed: 700 },
      { id: 'heavy', name: '파워냥', emoji: '🦁', cost: 180, hp: 220, atk: 70, speed: 0.7, range: 35, cooldown: 3500, atkSpeed: 1200 },
    ];
    
    const ENEMY_TYPES = [
      { id: 'basic', name: '졸개', emoji: '👹', hp: 60, atk: 14, speed: 0.8, range: 25, atkSpeed: 900 },
      { id: 'fast', name: '돌격병', emoji: '👺', hp: 45, atk: 16, speed: 1.8, range: 20, atkSpeed: 600 },
      { id: 'tank', name: '대형', emoji: '👾', hp: 160, atk: 20, speed: 0.5, range: 30, atkSpeed: 1300 },
      { id: 'range', name: '마법사', emoji: '🧙', hp: 40, atk: 32, speed: 0.6, range: 70, atkSpeed: 1100 },
    ];
    
    // ===== 게임 상태 =====
    let gameState = {
      money: 500,
      wave: 1,
      playerBaseHp: 1000,
      playerBaseMaxHp: 1000,
      enemyBaseHp: 1000,
      enemyBaseMaxHp: 1000,
      units: [],
      enemies: [],
      cooldowns: {},
      isPaused: false,
      isGameOver: false,
      lastUpdate: 0,
      moneyTimer: 0,
      enemySpawnTimer: 0,
    };
    
    let animationId = null;
    let unitIdCounter = 0;
    
    // ===== Element SDK 설정 =====
    const defaultConfig = {
      game_title: '냥코대전쟁',
      primary_color: '#f97316',
      secondary_color: '#1f2937',
      text_color: '#ffffff',
      accent_color: '#eab308',
      background_color: '#87CEEB'
    };
    
    let config = { ...defaultConfig };
    
    function applyConfig(cfg) {
      config = { ...defaultConfig, ...cfg };
      
      const titleEl = document.getElementById('game-title');
      if (titleEl) {
        titleEl.textContent = config.game_title || defaultConfig.game_title;
      }
    }
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (cfg) => {
          applyConfig(cfg);
        },
        mapToCapabilities: (cfg) => ({
          recolorables: [
            {
              get: () => cfg.primary_color || defaultConfig.primary_color,
              set: (v) => window.elementSdk.setConfig({ primary_color: v })
            },
            {
              get: () => cfg.secondary_color || defaultConfig.secondary_color,
              set: (v) => window.elementSdk.setConfig({ secondary_color: v })
            },
            {
              get: () => cfg.text_color || defaultConfig.text_color,
              set: (v) => window.elementSdk.setConfig({ text_color: v })
            },
            {
              get: () => cfg.accent_color || defaultConfig.accent_color,
              set: (v) => window.elementSdk.setConfig({ accent_color: v })
            },
            {
              get: () => cfg.background_color || defaultConfig.background_color,
              set: (v) => window.elementSdk.setConfig({ background_color: v })
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (cfg) => new Map([
          ['game_title', cfg.game_title || defaultConfig.game_title]
        ])
      });
    }
    
    // ===== UI 함수들 =====
    function showScreen(screenId) {
      document.querySelectorAll('#start-screen, #game-screen, #pause-menu, #result-screen').forEach(el => {
        el.classList.add('hidden');
        el.style.display = 'none';
      });
      
      const screen = document.getElementById(screenId);
      if (screen) {
        screen.classList.remove('hidden');
        screen.style.display = screenId.includes('menu') || screenId.includes('result') ? 'flex' : 'flex';
      }
    }
    
    function createCatButtons() {
      const container = document.getElementById('cat-buttons');
      container.innerHTML = '';
      
      CAT_TYPES.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn flex flex-col items-center bg-gradient-to-b from-orange-100 to-orange-200 rounded-xl p-2 min-w-16 border-2 border-orange-300 shadow-md relative';
        btn.id = `cat-btn-${cat.id}`;
        btn.onclick = () => spawnCat(cat);
        btn.innerHTML = `
          <span class="text-2xl">${cat.emoji}</span>
          <span class="text-xs font-bold text-gray-700">${cat.name}</span>
          <span class="text-xs text-yellow-600 font-bold">💰${cat.cost}</span>
          <div class="cooldown-overlay rounded-b-lg" style="height: 0%"></div>
        `;
        container.appendChild(btn);
      });
    }
    
    function updateUI() {
      document.getElementById('money').textContent = gameState.money;
      document.getElementById('wave').textContent = gameState.wave;
      
      const playerHpPercent = (gameState.playerBaseHp / gameState.playerBaseMaxHp) * 100;
      document.getElementById('player-base-hp').style.width = `${Math.max(0, playerHpPercent)}%`;
      
      const enemyHpPercent = (gameState.enemyBaseHp / gameState.enemyBaseMaxHp) * 100;
      document.getElementById('enemy-base-hp').style.width = `${Math.max(0, enemyHpPercent)}%`;
      
      // 쿨다운 업데이트
      const now = Date.now();
      CAT_TYPES.forEach(cat => {
        const btn = document.getElementById(`cat-btn-${cat.id}`);
        if (!btn) return;
        
        const cooldownEnd = gameState.cooldowns[cat.id] || 0;
        const remaining = Math.max(0, cooldownEnd - now);
        const percent = (remaining / cat.cooldown) * 100;
        
        const overlay = btn.querySelector('.cooldown-overlay');
        if (overlay) {
          overlay.style.height = `${percent}%`;
        }
        
        btn.disabled = remaining > 0 || gameState.money < cat.cost;
      });
    }
    
    // ===== 게임 로직 =====
    function startGame() {
      gameState = {
        money: 500,
        wave: 1,
        playerBaseHp: 1000,
        playerBaseMaxHp: 1000,
        enemyBaseHp: 1000,
        enemyBaseMaxHp: 1000,
        units: [],
        enemies: [],
        cooldowns: {},
        isPaused: false,
        isGameOver: false,
        lastUpdate: Date.now(),
        moneyTimer: 0,
        enemySpawnTimer: 0,
      };
      
      document.getElementById('battlefield').innerHTML = '';
      createCatButtons();
      showScreen('game-screen');
      
      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }
    
    function spawnCat(catType) {
      if (gameState.money < catType.cost) return;
      if (gameState.cooldowns[catType.id] > Date.now()) return;
      
      gameState.money -= catType.cost;
      gameState.cooldowns[catType.id] = Date.now() + catType.cooldown;
      
      const unit = {
        id: ++unitIdCounter,
        type: catType,
        x: 80,
        hp: catType.hp,
        maxHp: catType.hp,
        isEnemy: false,
        state: 'walking',
        lastAttack: 0,
      };
      
      gameState.units.push(unit);
      createUnitElement(unit);
      updateUI();
    }
    
    function spawnEnemy() {
      const typeIdx = Math.floor(Math.random() * Math.min(gameState.wave, ENEMY_TYPES.length));
      const enemyType = ENEMY_TYPES[typeIdx];
      
      const hpMultiplier = 1 + (gameState.wave - 1) * 0.2;
      const atkMultiplier = 1 + (gameState.wave - 1) * 0.15;
      
      const enemy = {
        id: ++unitIdCounter,
        type: {
          ...enemyType,
          hp: Math.floor(enemyType.hp * hpMultiplier),
          atk: Math.floor(enemyType.atk * atkMultiplier),
        },
        x: window.innerWidth - 100,
        hp: Math.floor(enemyType.hp * hpMultiplier),
        maxHp: Math.floor(enemyType.hp * hpMultiplier),
        isEnemy: true,
        state: 'walking',
        lastAttack: 0,
      };
      
      gameState.enemies.push(enemy);
      createUnitElement(enemy);
    }
    
    function createUnitElement(unit) {
      const battlefield = document.getElementById('battlefield');
      const el = document.createElement('div');
      el.id = `unit-${unit.id}`;
      el.className = 'unit absolute bottom-0 flex flex-col items-center spawning';
      el.style.cssText = `--dir: ${unit.isEnemy ? -1 : 1}; left: ${unit.x}px; transition: left 0.05s linear;`;
      el.innerHTML = `
        <div class="w-10 bg-gray-700 rounded-full h-1 mb-1">
          <div class="hp-bar h-1 rounded-full ${unit.isEnemy ? 'bg-red-500' : 'bg-green-500'}" style="width: 100%"></div>
        </div>
        <span class="text-3xl select-none">${unit.type.emoji}</span>
      `;
      battlefield.appendChild(el);
      
      setTimeout(() => el.classList.remove('spawning'), 300);
    }
    
    function updateUnitElement(unit) {
      const el = document.getElementById(`unit-${unit.id}`);
      if (!el) return;
      
      el.style.left = `${unit.x}px`;
      
      const hpBar = el.querySelector('.hp-bar');
      if (hpBar) {
        hpBar.style.width = `${(unit.hp / unit.maxHp) * 100}%`;
      }
      
      // 상태 클래스 업데이트
      el.classList.remove('walking', 'attacking');
      if (unit.state === 'walking') el.classList.add('walking');
      if (unit.state === 'attacking') el.classList.add('attacking');
    }
    
    function removeUnitElement(unit, withReward = false) {
      const el = document.getElementById(`unit-${unit.id}`);
      if (!el) return;
      
      el.classList.add('dying');
      
      if (withReward && unit.isEnemy) {
        const reward = 20 + gameState.wave * 5;
        gameState.money += reward;
        showMoneyPopup(unit.x, reward);
      }
      
      setTimeout(() => el.remove(), 400);
    }
    
    function showMoneyPopup(x, amount) {
      const container = document.getElementById('popup-container');
      const popup = document.createElement('div');
      popup.className = 'money-popup absolute text-yellow-400 font-bold text-lg';
      popup.style.cssText = `left: ${x}px; bottom: 80px; text-shadow: 1px 1px 2px black;`;
      popup.textContent = `+💰${amount}`;
      container.appendChild(popup);
      setTimeout(() => popup.remove(), 800);
    }
    
    function showDamagePopup(x, damage, isEnemy) {
      const container = document.getElementById('popup-container');
      const popup = document.createElement('div');
      popup.className = 'money-popup absolute font-bold text-sm';
      popup.style.cssText = `left: ${x}px; bottom: 100px; color: ${isEnemy ? '#ef4444' : '#22c55e'}; text-shadow: 1px 1px 2px black;`;
      popup.textContent = `-${damage}`;
      container.appendChild(popup);
      setTimeout(() => popup.remove(), 600);
    }
    
    function findTarget(unit, targets) {
      let closest = null;
      let closestDist = Infinity;
      
      targets.forEach(target => {
        const dist = Math.abs(target.x - unit.x);
        if (dist < closestDist) {
          closestDist = dist;
          closest = target;
        }
      });
      
      return { target: closest, distance: closestDist };
    }
    
    function gameLoop() {
      if (gameState.isGameOver) return;
      
      const now = Date.now();
      const dt = (now - gameState.lastUpdate) / 1000;
      gameState.lastUpdate = now;
      
      if (gameState.isPaused) {
        animationId = requestAnimationFrame(gameLoop);
        return;
      }
      
      // 돈 자동 생성
      gameState.moneyTimer += dt;
      if (gameState.moneyTimer >= 1) {
        gameState.money += 10 + gameState.wave * 2;
        gameState.moneyTimer = 0;
      }
      
      // 적 스폰
      gameState.enemySpawnTimer += dt;
      const spawnInterval = Math.max(1.5, 4 - gameState.wave * 0.3);
      if (gameState.enemySpawnTimer >= spawnInterval) {
        spawnEnemy();
        gameState.enemySpawnTimer = 0;
      }
      
      // 유닛 업데이트
      const battlefieldWidth = document.getElementById('battlefield').offsetWidth;
      
      // 아군 유닛 로직
      gameState.units.forEach(unit => {
        const { target, distance } = findTarget(unit, gameState.enemies);
        
        // 적 기지 공격 범위
        const toEnemyBase = battlefieldWidth - 100 - unit.x;
        
        if (target && distance <= unit.type.range) {
          // 적 유닛 공격
          unit.state = 'attacking';
          if (now - unit.lastAttack >= unit.type.atkSpeed) {
            target.hp -= unit.type.atk;
            unit.lastAttack = now;
            showDamagePopup(target.x, unit.type.atk, true);
            
            const targetEl = document.getElementById(`unit-${target.id}`);
            if (targetEl) {
              targetEl.classList.add('hit');
              setTimeout(() => targetEl.classList.remove('hit'), 150);
            }
          }
        } else if (toEnemyBase <= unit.type.range) {
          // 적 기지 공격
          unit.state = 'attacking';
          if (now - unit.lastAttack >= unit.type.atkSpeed) {
            gameState.enemyBaseHp -= unit.type.atk;
            unit.lastAttack = now;
          }
        } else {
          // 이동
          unit.state = 'walking';
          unit.x += unit.type.speed * dt * 60;
        }
        
        updateUnitElement(unit);
      });
      
      // 적 유닛 로직
      gameState.enemies.forEach(enemy => {
        const { target, distance } = findTarget(enemy, gameState.units);
        
        // 아군 기지까지의 거리
        const toPlayerBase = enemy.x - 80;
        
        if (target && distance <= enemy.type.range) {
          // 아군 유닛 공격
          enemy.state = 'attacking';
          if (now - enemy.lastAttack >= enemy.type.atkSpeed) {
            target.hp -= enemy.type.atk;
            enemy.lastAttack = now;
            showDamagePopup(target.x, enemy.type.atk, false);
            
            const targetEl = document.getElementById(`unit-${target.id}`);
            if (targetEl) {
              targetEl.classList.add('hit');
              setTimeout(() => targetEl.classList.remove('hit'), 150);
            }
          }
        } else if (toPlayerBase <= enemy.type.range) {
          // 아군 기지 공격
          enemy.state = 'attacking';
          if (now - enemy.lastAttack >= enemy.type.atkSpeed) {
            gameState.playerBaseHp -= enemy.type.atk;
            enemy.lastAttack = now;
          }
        } else {
          // 이동
          enemy.state = 'walking';
          enemy.x -= enemy.type.speed * dt * 60;
        }
        
        updateUnitElement(enemy);
      });
      
      // 죽은 유닛 제거
      gameState.units = gameState.units.filter(unit => {
        if (unit.hp <= 0) {
          removeUnitElement(unit, false);
          return false;
        }
        return true;
      });
      
      gameState.enemies = gameState.enemies.filter(enemy => {
        if (enemy.hp <= 0) {
          removeUnitElement(enemy, true);
          return false;
        }
        return true;
      });
      
      // 웨이브 진행
      if (gameState.enemies.length === 0 && gameState.enemySpawnTimer >= spawnInterval * 0.8) {
        // 랜덤하게 웨이브 증가
        if (Math.random() < 0.1) {
          gameState.wave++;
          gameState.enemyBaseMaxHp += 200;
          gameState.enemyBaseHp = Math.min(gameState.enemyBaseHp + 100, gameState.enemyBaseMaxHp);
        }
      }
      
      // 게임 종료 체크
      if (gameState.playerBaseHp <= 0) {
        endGame(false);
        return;
      }
      if (gameState.enemyBaseHp <= 0) {
        endGame(true);
        return;
      }
      
      updateUI();
      animationId = requestAnimationFrame(gameLoop);
    }
    
    function endGame(isVictory) {
      gameState.isGameOver = true;
      if (animationId) cancelAnimationFrame(animationId);
      
      document.getElementById('result-icon').textContent = isVictory ? '🎉' : '😿';
      document.getElementById('result-title').textContent = isVictory ? '승리!' : '패배...';
      document.getElementById('result-message').textContent = isVictory 
        ? `적 기지를 파괴했습니다! (Wave ${gameState.wave})` 
        : `아군 기지가 파괴되었습니다... (Wave ${gameState.wave})`;
      
      showScreen('result-screen');
    }
    
    function showPauseMenu() {
      gameState.isPaused = true;
      const menu = document.getElementById('pause-menu');
      menu.classList.remove('hidden');
      menu.style.display = 'flex';
    }
    
    function resumeGame() {
      gameState.isPaused = false;
      gameState.lastUpdate = Date.now();
      const menu = document.getElementById('pause-menu');
      menu.classList.add('hidden');
      menu.style.display = 'none';
    }
    
    function restartGame() {
      document.getElementById('pause-menu').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      startGame();
    }
    
    function goToTitle() {
      gameState.isGameOver = true;
      if (animationId) cancelAnimationFrame(animationId);
      showScreen('start-screen');
    }
    
    // 초기화
    applyConfig(config);
  </script>
